<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>label标签学习</title>
</head>
<body>
  <!-- 写法一 -->
  <input type="radio" id="man"><label for="man">男</label>

  <!-- 写法二 -->
