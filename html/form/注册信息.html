<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册信息</title>
</head>
<body>
    <h2>注册信息</h2>
    <form action="">
        <!-- 表单控件 -->
         <!-- 个人信息 -->
          <!-- 教育经历 -->
           <!-- 工作经历 -->
        <h3>个人信息</h3>
        <label>姓名：</label><input type="text" placeholder="请输入真实姓名"></input><br>
        <label>密码：</label><input type="password" placeholder="请输入密码"></input><br>
        <label>确认密码：</label><input type="password" placeholder="请再次输入密码"></input><br>
        <lable>性别:</lable>
        <label><input type="radio" name="gender" checked>男</label>
        <label><input type="radio" name="gender">女</label><br>
        <label>居住城市:</label>
        <select>
            <option>上海</option>
            <option selected>深圳</option>
            <option>广州</option>
            <option>南阳</option>
        </select>
        <h3>教育经历:</h3>
          <label>最高学历</label>
          <select>
            <option>高中</option>
            <option>大专</option>
            <option selected>本科</option>
            <option>硕士</option>
            <option>博士</option>
        </select><br>
        <label>学校名称:</label><input type="text" placeholder="请输入学校名称"></input><br>
        <label>所学专业:</label><input type="text" placeholder="请输入专业名称"></input><br>
        <label>在校时间:</label><br>
        <select>
            <option>2015</option>
            <option>2016</option>
            <option>2017</option>
            <option>2018</option>
        </select>
        --
        <select>
            <option>2019</option>
            <option>2020</option>
            <option>2021</option>
            <option>2022</option>
        </select>

        <h3>工作经历</h3>
        <label>公司名称:</label><input type="text" placeholder="请输入公司名称"></input><br></br>
        <label>工作描述:</label><br>
        <textarea></textarea><br>
        <input type="checkbox"><label>已阅读并同意以下协议:</label></input>
        <ul>
            <li><a href="">《用户服务协议》</a></li>
            <li><a href="">《隐私政策》</a></li>
        </ul>

        <button>免费注册</button>
        <button type="reset">重新填写</button>
    </form>
</body>
</html>
