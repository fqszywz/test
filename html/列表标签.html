<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>列表标签学习</title>
</head>
<body>
  <!-- 无需列表 -->
  <ul>
    <li>平安集团</li>
    <li>平安证券</li>
    <li>平安银行</li>
    <li>平安科技</li>
    <li>平安保险</li>
    <li>平安eva</li>
    <li>平安健康</li>
  </ul>
  <!-- 有序列表 -->
   <ol>
    <li>平安集团</li>
    <li>平安证券</li>
    <li>平安银行</li>
    <li>平安科技</li>
    <li>平安保险</li>
    <li>平安eva</li>
    <li>平安健康</li>
   </ol>
   <!-- 定义列表 -->
    <dl>
      <dt>平安集团子公司</dt>
      <dd>平安证券</dd>
      <dd>平安银行</dd>
      <dd>平安科技</dd>
      <dd>平安保险</dd>
      <dd>平安eva</dd>
      <dd>平安健康</dd>
    </dl>
</body>
</html>
