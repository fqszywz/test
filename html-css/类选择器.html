<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>类选择器</title>
    <style>
        .blue {
            color: blue;
        }
        .red {
            color: red;
        }
        .size {
            font-size: 30px;
        }
    </style>
</head>
<body>
    <div class="blue">这是div标签1 blue</div>
    <div class="red">这是div标签2 red</div>
    <p class="red">这是p标签1</p>
    <p class="blue">这是p标签2</p>
    <!-- 一个标签可以使用多个类名，class属性写多个类名，类名用空格隔开 -->
    <p class="blue size" >这是p标签3</p>
</body>
</html>
