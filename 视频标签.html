<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <!-- controls 显示视频控制面板  -->
  <!-- loop 循环播放 -->
  <!-- autoplay 自动播放 -->
  <!-- muted 静音播放 -->
  <video src="./video/1.mp4" controls></video>
  <video src="./video/2.mp4" controls loop></video>
  <video src="./video/3.mp4" controls autoplay></video>
  <video src="./video/4.mp4" controls muted></video>
</body>
</html>
